
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Student Study Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Study Hub</h1>
        <p>Your companion for smarter studying!</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="resources.html">Study Resources</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>
        <section id="contact">
            <h2>Contact Us</h2>

            <p class="section-intro">
                Have a question or suggestion? Send us a message.
            </p>

            <form id="contact-form" name="contact" method="POST" data-netlify="true">
            <input type="hidden" name="form-name" value="contact">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                        minlength="2"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="Write your message here..."
                        required
                        minlength="10"
                    ></textarea>
                </div>

                <button type="submit">Send Message</button>

                <p id="form-feedback" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer>
        <h3>Follow Student Study Hub</h3>
        <p>Connect with us on social media</p>

        <div class="social-links">
            <a href="https://www.facebook.com/"
               target="_blank"
               rel="noopener noreferrer">Facebook</a>

            <a href="https://www.youtube.com/"
               target="_blank"
               rel="noopener noreferrer">YouTube</a>
        </div>

        <p>&copy; 2026 Student Study Hub. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
